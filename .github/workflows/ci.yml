name: ci

on:
  push:
    branches: [main, "feat/**", "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: CLI smoke test
        run: |
          state="$(mktemp -d)"
          memoria init --db "$state/memoria.db"
          memoria record --db "$state/memoria.db" --kind canary --title "CI" --body "deployment readiness evidence" --entity memoria
          memoria verify --db "$state/memoria.db"
          memoria packet --db "$state/memoria.db" --task "CI adapter" --query "readiness evidence" --max-chars 500
